name: Go CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (with coverage)
        run: go test ./... -v -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $total%"
          threshold=30
          awk -v t="$total" -v th="$threshold" 'BEGIN { exit !(t+0 >= th+0) }' \
            || (echo "Coverage $total% is below threshold ${threshold}%" && exit 1)

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PG_USER: test
      PG_PASSWORD: test
      PG_DB: test
      PG_PORT: 5432
      PG_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run migrations
        run: |
          goose -dir ./migration postgres \
            "postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}?sslmode=disable" up

      - name: Run integration tests
        run: go test -tags=integration ./... -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0

